/* Layout restored from original MainForm.LayoutApp */
:root{--bg:#16111e;--panel:#201828;--panel2:#241d30;--edge:#574762;--text:#efe8f3;--muted:#9d91a8}
body{background:var(--bg);font-family:'PixelMplus12','Yu Gothic UI',sans-serif;min-height:100vh}
.shell{max-width:1250px;min-width:920px;min-height:0;margin:auto;padding:0 22px 16px}
.session-panel{display:none}
.session-row{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;justify-content:flex-end;flex-wrap:nowrap}
.session-row label{font-size:12px;font-weight:700;margin-right:0;white-space:nowrap}
.session-row #sessionName{width:220px;max-width:260px;min-width:100px;flex:1 1 170px;height:32px;padding:5px 9px}
.session-row #session{width:116px!important;max-width:116px!important;flex:0 0 116px;height:32px;order:2;padding:4px 8px}
.session-row #addSession{order:3;white-space:nowrap;font-size:11px;height:32px;padding:4px 8px}
.session-row label{order:0}.session-row #sessionName{order:1}
.utility-row{display:flex;align-items:center;gap:4px;margin-right:12px;position:static;min-width:0}
.utility-row button{font-size:10px;padding:5px 6px;opacity:.8;white-space:nowrap}
.panel{margin-bottom:16px;border-radius:6px;box-shadow:none;background:#211a2a;padding:15px}
.entry-panel{height:112px;z-index:5;overflow:visible;padding:9px 15px 10px}
.entry-panel>.headline{margin-bottom:7px;height:35px;flex-wrap:nowrap;gap:12px}
.entry-panel .headline h2{font-size:16px;letter-spacing:0}.records-panel .headline h2{font-size:18px;letter-spacing:0}
.entry-grid{display:flex!important;align-items:flex-start;gap:10px;height:46px}
.entry-grid>.control{display:flex;flex-direction:column;gap:0}
.entry-grid>.control label{display:none}
.entry-grid>.control:first-child{width:75px;flex:0 0 75px}
.entry-grid>.control:nth-child(2){flex:0 0 104px;width:104px}
.entry-grid>.control:nth-child(4){flex:1 1 175px;min-width:155px;max-width:245px}
.entry-grid .pick{height:46px;min-height:46px;padding:3px 6px;text-align:center;border-radius:6px;white-space:normal;font-size:11px}
.players-compact{width:250px;flex:0 0 250px;display:flex;gap:3px;border:1px solid var(--edge);border-radius:5px;height:46px;padding:2px 5px;align-items:center}
.players-compact .control{flex:1;min-width:0;gap:3px}
.players-compact label{font-size:9px;line-height:12px;letter-spacing:0;text-align:center;white-space:nowrap}
.players-compact input{font-size:13px;text-align:center;padding:2px;height:25px}
.entry-grid #addEntry{height:46px;min-width:90px;flex:0 0 90px;font-size:13px;padding:3px}
.entry-grid #cancelEdit{position:absolute;right:23px;top:3px;padding:3px 8px;font-size:11px}
.selector{position:absolute;left:0;top:100%;width:100%;margin:0;padding:12px;background:#241d31;border:1px solid var(--edge);border-radius:0 0 7px 7px;z-index:25;box-shadow:0 9px 20px #0008;max-height:min(72vh,680px);overflow:auto;transform-origin:top;animation:dropdown .2s ease-out}
@keyframes dropdown{from{opacity:.5;transform:scaleY(.85)}to{opacity:1;transform:scaleY(1)}}
#tileGrid{max-height:min(60vh,590px)}
.records-panel{min-height:450px;margin-top:0;z-index:1}
.records-panel .headline{height:36px;margin-bottom:12px;flex-wrap:nowrap}
.records-panel .headline .tiny{display:none}
.records-panel .headline h2{white-space:nowrap}
.records-panel .list-tools #search{display:none}
.records-panel #records{min-height:340px}
.group-heading{background:transparent;border-left:0;font-size:18px;padding:8px 0;margin:8px 0 2px}
.record{background:transparent;border:0;border-bottom:1px solid #372c43;border-radius:0;min-height:53px;padding:6px 8px}
.record .round{display:none}
.tile:before{display:none}
.tile{border-radius:2px}
.tilegrid.terror-layout .tile{height:38px;min-height:38px}
@media(max-width:940px){.shell{margin:0}.session-row #sessionName{width:160px}.entry-heading{gap:7px}}

/* Original .NET geometry: Classic/Alternate 32×32px icons, 4px gaps; Unbound 38×38px */
.tilegrid.terror-layout{grid-template-columns:repeat(12,32px)!important;grid-auto-rows:32px;gap:4px!important;width:max-content;max-width:100%;justify-content:start;overflow:auto;max-height:min(72vh,650px)}
.tilegrid.terror-layout .tile{width:32px;height:32px;min-height:32px;padding:0;margin:0;border-radius:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.terror-icon{display:flex;align-items:center;justify-content:center;font-size:9px;font-variant-numeric:tabular-nums;color:#9e8fb0;background:linear-gradient(150deg,#292037,#140f1c);border:1px solid #4e3a62;width:32px;height:32px;flex-shrink:0}
.tile.active .terror-icon{background:#65407f;border-color:#d2a7f4;color:white}
.tilegrid.terror-layout .tile:hover .terror-icon{border-color:#cfa0f1;color:white}
.tilegrid.terror-layout:has(.unbound){grid-template-columns:repeat(3,minmax(180px,1fr))!important;width:100%;gap:4px 14px!important}
.tilegrid.terror-layout .tile.unbound{width:100%;height:42px;min-height:42px;display:flex;flex-direction:row;justify-content:flex-start;gap:7px;font-size:11px;padding:2px 4px}
.tilegrid.terror-layout .tile.unbound .terror-icon{width:38px;height:38px}
.terror-name{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#eee4f5}
#terrorNamePreview{color:#e4cff8;font-size:13px;min-height:18px;font-weight:600;margin-top:3px}
.tilegrid.map-layout{grid-template-columns:repeat(9,minmax(95px,1fr));gap:4px}
.tilegrid.map-layout .tile.map{aspect-ratio:102/20;height:auto;min-height:20px;padding:1px 2px}

/* Native round sprite atlas: pixel-accurate 32 x 32 crops from the .NET shared atlas. */
.round-sprite{display:inline-block;flex:0 0 32px;width:32px;height:32px;background-image:url('./assets/round_atlas.png');background-repeat:no-repeat;image-rendering:pixelated}
#roundButton.has-round-sprite{display:flex;align-items:center;justify-content:center;padding:3px}
/* Round chooser: selected sprites rise 5px; no tile backgrounds. */
.selector.round-selecting{padding:5px 12px 6px}
.selector.round-selecting .choice-title,
.selector.round-selecting #selectorTabs,
.selector.round-selecting #terrorNamePreview{display:none}
.tilegrid.round-layout{display:grid;grid-template-columns:repeat(13,36px);grid-auto-rows:48px;gap:0;max-height:none;overflow-x:auto;overflow-y:hidden;width:max-content;max-width:100%;padding:0}
.tilegrid.variant-layout{display:grid;grid-template-columns:repeat(5,36px);grid-auto-rows:48px;gap:0;padding:0}
.tilegrid.round-layout .tile.round-tile,
.tilegrid.variant-layout .tile.round-tile{
 position:relative;display:flex;align-items:center;justify-content:center;
 width:36px;height:32px;min-height:32px;align-self:end;
 margin:0;padding:0;overflow:visible;border:0!important;border-radius:0;
 background:transparent!important;box-shadow:none!important;
 transition:transform .18s ease,filter .18s ease
}
.tilegrid.round-layout .tile.round-tile:hover,
.tilegrid.variant-layout .tile.round-tile:hover{background:transparent!important;filter:brightness(1.2)}
.tilegrid.round-layout .tile.round-tile.active,
.tilegrid.variant-layout .tile.round-tile.active{
 background:transparent!important;border:0!important;transform:translateY(-5px)
}
.tilegrid.round-layout .tile.round-tile.has-variants::after{content:none}
.tilegrid.round-layout .tile.variant-tile{align-self:end}

/* Pressable feel shared by all enabled controls; never modify application state. */
button:not(:disabled){
  transform-origin:center center;
  transition:transform 140ms cubic-bezier(.2,.75,.25,1),box-shadow 140ms ease,filter 140ms ease,background-color 140ms ease;
}
button:not(:disabled):hover{
  transform:translateY(1px) scale(.97);
  box-shadow:inset 0 2px 3px #0005;
  filter:brightness(.97);
}
button:not(:disabled):active{
  transform:translateY(3px) scale(.92);
  box-shadow:inset 0 3px 6px #0009;
  filter:brightness(.88);
  transition-duration:65ms;
}
/* Round icon buttons stay entirely transparent while preserving the small rise. */
.tilegrid.round-layout .tile.round-tile:not(:disabled):hover,
.tilegrid.variant-layout .tile.round-tile:not(:disabled):hover{
  transform:translateY(1px) scale(.96);
  background:transparent!important;
  box-shadow:none!important;
  filter:brightness(.96);
}
.tilegrid.round-layout .tile.round-tile.active:not(:disabled):hover,
.tilegrid.variant-layout .tile.round-tile.active:not(:disabled):hover{
  transform:translateY(-4px) scale(.96);
}
.tilegrid.round-layout .tile.round-tile:not(:disabled):active,
.tilegrid.variant-layout .tile.round-tile:not(:disabled):active{
  transform:translateY(3px) scale(.90);
  background:transparent!important;
  box-shadow:none!important;
  filter:brightness(.82);
}
.tilegrid.round-layout .tile.round-tile.active:not(:disabled):active,
.tilegrid.variant-layout .tile.round-tile.active:not(:disabled):active{
  transform:translateY(-1px) scale(.90);
}
@media(prefers-reduced-motion:reduce){
  button:not(:disabled){transition:none!important}
}

@media(prefers-reduced-motion:reduce){.tilegrid.round-layout .tile.round-tile,.tilegrid.variant-layout .tile.round-tile{transition:none}}

/* Fit the archive to a maximized desktop browser without changing its internal layout. */
@media(min-width:1280px){
  .selector{max-height:min(50vh,500px)}
  #tileGrid{max-height:min(44vh,430px)}
}
@media(max-width:940px){
  .shell{width:100%;min-width:920px}
}

/* Borderless pixel icon selector and native placeholder. */
#roundButton,#roundButton.selected,#roundButton:hover,
#roundButton.has-round-sprite{background:transparent!important;border:0!important;box-shadow:none!important}
#roundButton{display:flex;align-items:center;justify-content:center;padding:3px}
#terrorButton.has-terror-sprite{display:flex;align-items:center;justify-content:flex-start;gap:4px;padding:3px 8px}
.question-icon,.terror-canvas{display:block;flex:0 0 32px;width:32px;height:32px;image-rendering:pixelated}
.tilegrid.terror-layout{grid-auto-rows:32px!important;grid-template-columns:repeat(12,32px)!important;gap:4px!important}
.tilegrid.terror-layout .tile:not(.unbound){width:32px;height:32px;min-height:32px;padding:0;border:0;overflow:hidden}
.tilegrid.terror-layout .tile:not(.unbound).active{outline:1px solid #f3e2ff;outline-offset:-1px;background:#554063}
.tilegrid.terror-layout .tile:not(.unbound):disabled{opacity:.5;cursor:not-allowed}
.tilegrid.terror-layout .tile.rare-active::after{content:'';position:absolute;right:1px;bottom:1px;width:5px;height:5px;background:#f2df7a;pointer-events:none}
.tilegrid.terror-layout .tile{position:relative}
.tilegrid.terror-layout.combined-layout{grid-auto-flow:row}
.tilegrid.terror-layout.unbound-layout{grid-template-columns:repeat(6,minmax(130px,1fr))!important;grid-auto-rows:42px!important;width:100%;gap:3px 8px!important}
.tilegrid.terror-layout.unbound-layout .tile.unbound{width:100%;height:42px;min-height:42px;display:flex;flex-direction:row;justify-content:flex-start;padding:2px 4px;gap:5px}
.record-terror-icons{display:inline-flex;align-items:center;gap:4px}
.record-terror-icons .terror-canvas{width:32px;height:32px}
.terror-canvas.unbound-canvas,.record-terror-icons .terror-canvas.unbound-canvas{width:38px;height:38px;flex-basis:38px}
.tile.unbound .terror-name{font-size:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* Keep unusually long variant names from expanding record rows horizontally. */
.record .terror-display-name{min-width:0;max-width:min(45vw,440px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Terror picker: only the hovered terror name above the icon grid. */

.selector.terror-selecting .choice-title,
.selector.terror-selecting #selectorTabs{display:none}
.selector.terror-selecting #terrorNamePreview{

   appearance as the fallback. Preserve imported per-variant order. */
function summaryBaseOrder(){

 const used=[...new Set(records.map(r=>r.round))];
 const stored=Array.isArray(session.summaryRoundOrder)?session.summaryRoundOrder:[];
 const rank=base=>stored.findIndex(key=>key===base||String(key).startsWith(base+'|'));

   const ai=rank(a),bi=rank(b);
   return ai<0&&bi<0?0:(ai<0?Infinity:ai)-(bi<0?Infinity:bi);

function summaryRecordsByBase(){

 for(const base of summaryBaseOrder()){
   const entries=session.records.filter(r=>!r.summaryPinned&&r.round===base);
   const variantsInOrder=[...new Set(entries.map(r=>r.variant||''))];
   variantsInOrder.sort((a,b)=>{
     const ai=stored.indexOf(base+'|'+a),bi=stored.indexOf(base+'|'+b);
     return ai<0&&bi<0?0:(ai<0?Infinity:ai)-(bi<0?Infinity:bi);
   });

async function summaryExportPng(){
 const session=current(),iconMode=state.mode!=='text';
 const cols=iconMode?summaryBuildColumns():[[
   ...(session.records.some(r=>r.summaryPinned)?[{base:'__highlights',groups:[{round:'__highlights',variant:'',records:session.records.filter(r=>r.summaryPinned)}]}]:[]),
   ...summaryRecordsByBase()
 ],[]];
 const W=1080,colW=518,leftX=16,rightX=546,pad=16,headerH=54,gap=12;
 try{
   if(document.fonts?.ready)await document.fonts.ready;
   const rowHeight=rec=>iconMode?summaryRowHeight(rec):(rec.summaryUppercase?70:49);
   const groupHeight=group=>25+group.records.reduce((sum,rec)=>sum+rowHeight(rec),0)+3;
   const blocksHeight=col=>col.reduce((sum,block)=>sum+block.groups.reduce((s,group)=>s+groupHeight(group)+gap,0),0);
   const H=Math.ceil(Math.max(140,headerH+pad+Math.max(...cols.map(blocksHeight))+pad));
   if(H>16000)throw Error('PNGの高さ上限を超えました');
   const output=document.createElement('canvas');output.width=W;output.height=H;
   const g=output.getContext('2d');
   g.fillStyle='#211a2a';g.fillRect(0,0,W,H);
   g.fillStyle='#b189d2';g.fillRect(0,0,4,headerH);
   g.fillStyle='#efe8f3';g.font='700 22px "PixelMplus12",sans-serif';
   g.fillText(session.name||'ToN Results',22,34,W-44);
   const stroke=(fromX,fromY,toX,toY)=>{g.beginPath();g.moveTo(fromX+.5,fromY+.5);g.lineTo(toX+.5,toY+.5);g.stroke()};
   for(let c=0;c<(iconMode?2:1);c++){
     let y=headerH+pad,x=iconMode?(c?rightX:leftX):leftX;
     const width=iconMode?colW:W-32;
     for(const block of cols[c]){
       for(const group of block.groups){
         const gh=groupHeight(group),color=summaryGroupColor(group.round,group.variant),title=summaryGroupTitle(group);
         // Native border starts at x+35, y+24; title interrupts the top line.
         g.strokeStyle=color;g.lineWidth=1;
         g.font='700 16px "PixelMplus12",sans-serif';
         const titleX=x+(group.round==='__highlights'?14:53);
         const titleWidth=g.measureText(title).width;
         const top=y+24,bottom=y+gh-3,frameLeft=x+35,frameRight=x+width-4;
         stroke(Math.min(frameRight,titleX+titleWidth+6),top,frameRight,top);
         stroke(frameRight,top,frameRight,bottom);
         stroke(frameLeft,bottom,frameRight,bottom);
         stroke(frameLeft,y+22,frameLeft,bottom);
         if(group.round==='__highlights'){
           g.strokeStyle='#987daa';
           stroke(Math.min(frameRight-4,titleX+titleWidth+10),top+4,frameRight-4,top+4);
           stroke(frameRight-4,top+4,frameRight-4,bottom-4);
           stroke(frameLeft+4,bottom-4,frameRight-4,bottom-4);
           stroke(frameLeft+4,y+26,frameLeft+4,bottom-4);
         }else{
           const pos=(group.variant&&ROUND_SUBICON_COORDS[group.round+'|'+group.variant])||ROUND_ATLAS_COORDS[group.round];
           if(pos&&summaryRoundImageReady){
             g.imageSmoothingEnabled=false;
             g.drawImage(summaryRoundImage,pos[0],pos[1],32,32,x+14,y,32,32);
           }
         }
         g.font='700 16px "PixelMplus12",sans-serif';
         g.fillStyle=group.round==='__highlights'?'#d8b3f9':'#efe8f3';
         g.fillText(title,titleX,y+22,Math.max(0,width-65));
         let ry=y+25;
         for(const r of group.records){
           const rh=rowHeight(r),large=!!r.summaryUppercase;
           const ids=r.round==='Bloodbath'&&r.variant==='EX'&&r.terrors?.[0]?Array(3).fill(r.terrors[0]):r.terrors||[];
           if(iconMode){
             for(let k=0;k<Math.min(ids.length,4);k++){
               const id=ids[k],art=cachedTerrorCanvas(id,r.round,r.variant,r.rareChoices?.[id]);
               const size=id.startsWith('U')?(large?76:38):(large?64:32);
               if(art){
                 const col=k%3,row=Math.floor(k/3);
                 const startX=x+39+col*size,startY=ry+5+row*(size+4);
                 g.imageSmoothingEnabled=false;g.drawImage(art,startX,startY,size,size);
               }
             }
             if(r.round==='Unbound'&&ids[0]){
               g.font=(large?'18':'11')+'px "PixelMplus12",sans-serif';
               g.fillStyle='#eee8f3';
               g.fillText(terrorDisplayName(ids[0],r.round,r.rareChoices?.[ids[0]]),x+39,ry+(large?116:57),190);
             }
           }else{
             const label=ids.map(id=>terrorDisplayName(id,r.round,r.rareChoices?.[id])).join(', ')||'—';
             g.font=(r.summaryBold?'700 ':'400 ')+(large?'22':'15')+'px "PixelMplus12",sans-serif';
             g.fillStyle='#eee8f3';g.fillText(large?label.toUpperCase():label,x+52,ry+(large?45:31),360);
           }
           const vals=summaryCounts(r);
           if(iconMode){
             // Native: map at right, numbers immediately to its left.
             const mapX=x+width-4-4-204;
             const countX=mapX-146,newX=mapX-68;
             g.fillStyle='#efe8f3';
             g.font=(r.summaryBold?'700 ':'400 ')+(large?'29':'18')+'px "PixelMplus12",sans-serif';
             if(vals.pair)g.fillText(vals.pair,large?x+274:countX,ry+(large?39:29),large?126:72);
             if(vals.newcomer){
               g.fillStyle='#ad9cb7';g.font=(large?'17':'12')+'px "PixelMplus12",sans-serif';
               g.fillText('New',large?x+402:newX,ry+(large?33:27));
               g.fillStyle='#eee8f3';g.font=(r.summaryBold?'700 ':'400 ')+(large?'29':'18')+'px "PixelMplus12",sans-serif';
               g.fillText(vals.newcomer,(large?x+448:newX+28),ry+(large?39:29),55);
             }
             if(r.map){
               const badge=mapBadge(r.map);
               if(badge){g.imageSmoothingEnabled=false;g.drawImage(badge,mapX,ry+(large?rh-43:4),204,40)}
             }
           }else{
             g.fillStyle='#eee8f3';g.font=(large?'27':'18')+'px "PixelMplus12",sans-serif';
             if(vals.pair)g.fillText(vals.pair,x+540,ry+31,110);
             if(vals.newcomer){g.fillText('New '+vals.newcomer,x+650,ry+31,100)}
             if(r.map){const badge=mapBadge(r.map);if(badge){g.imageSmoothingEnabled=false;g.drawImage(badge,x+width-210,ry+4,204,40)}}
           }
           ry+=rh;
         }
         y+=gh+gap;
       }
     }
   }
   const blob=await new Promise((resolve,reject)=>output.toBlob(b=>b?resolve(b):reject(new Error('PNGの生成に失敗')),'image/png'));
   const a=document.createElement('a'),uri=URL.createObjectURL(blob);
   a.href=uri;a.download=(session.name||'ToN_Summary').replace(/[\\/:*?"<>|]/g,'_')+'_summary.png';
   document.body.append(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(uri),2500);
   notify('PNGを書き出しました');
 }catch(err){notify('PNG出力失敗: '+err.message)}
}

/* Backward-compatible importer for the original .NET ToNRoundRecords DataFile.
   Never rewrite the source file; convert a copy only after user confirmation. */
const NATIVE_ROUNDS={
 classic:'Classic',alternate:'Alternate','8pages':'8 Pages',fog:'Fog',ghost:'Ghost',
 punished:'Punished',cracked:'Cracked',sabotage:'Sabotage',bloodbath:'Bloodbath',
 midnight:'Midnight',unbound:'Unbound',moon:'Moon',other:'Other'
};
const NATIVE_VARIANTS={
 sabotage_1:'Sabotage 1',sabotage_2:'Sabotage 2',
 bloodbath:'BB',double_trouble:'DT',ex:'EX',
 moon_1:'Moon 1',moon_2:'Moon 2',moon_3:'Moon 3',moon_4:'Moon 4',
 other_1:'Other 1',other_2:'Other 2',other_3:'Other 3',other_4:'Other 4',other_5:'Other 5'
};
function nativeCatalogTerrorId(id){
 const raw=String(id||'').trim();
 if(/^T\d{3}$/.test(raw))return 'C'+raw.slice(1);
 if(/^ALT\d{3}$/.test(raw))return 'A'+raw.slice(3);
 if(/^8P\d{3}$/.test(raw))return 'E'+raw.slice(2);
 if(/^UB\d{3}$/.test(raw))return 'U'+raw.slice(2);
 if(/^(?:C|A|E|U)\d{3}$/.test(raw))return raw;
 throw Error('元ツールのテラーIDを解釈できません: '+raw);
}
function nativeRoundName(key){
 const value=String(key||'').trim();
 if(!value)return '';
 const name=NATIVE_ROUNDS[value.toLowerCase()]||rounds.find(r=>r.toLowerCase()===value.toLowerCase());
 if(!name)throw Error('未対応のラウンド: '+value);
 return name;
}
function nativeRoundOrderKey(key){
 const segments=String(key||'').split('|');
 return nativeRoundName(segments[0])+(segments.length>1&&segments[1]?'|'+(NATIVE_VARIANTS[segments[1]]||segments[1]):'');
}
function toWebFromNative(raw){
 const source=raw?.Data&&Array.isArray(raw.Data.Sessions)?raw.Data:raw;
 if(!Array.isArray(source?.Sessions))throw Error('元ツールの記録形式ではありません');
 const sessions=source.Sessions.map(session=>{
   const records=(session.Records||[]).map(record=>{
     const round=nativeRoundName(record.RoundId);
     const variant=NATIVE_VARIANTS[String(record.RoundVariantId||'').toLowerCase()]||'';
     const ids=(record.TerrorIds||[]).map(nativeCatalogTerrorId);
     if(round==='Unbound'&&record.UnboundId)ids.splice(0,ids.length,nativeCatalogTerrorId(record.UnboundId));
     const rareChoices={};
     for(const [key,val]of Object.entries(record.TerrorIconVariants||{})){
       rareChoices[nativeCatalogTerrorId(key)]=String(val);
     }
     if(round==='Unbound'&&record.UnboundVariantId&&ids.length)
       rareChoices[ids[0]]=String(record.UnboundVariantId);
     const map=String(record.MapId||'').trim();
     if(map&&!mapId(map))throw Error('元ツールのマップIDを解釈できません: '+map);
     return {
       id:String(record.Id||uid()),round,variant,terrors:ids,
       map:mapId(map)||'',rareChoices,
       survived:record.Survived??null,players:record.Players??null,
       newPlayers:record.NewSurvivors??null,
       summaryUppercase:!!record.SummaryUppercase,
       summaryBold:!!record.SummaryBold,summaryPinned:!!record.SummaryPinned,
       createdAt:record.CreatedAt||null,
       sourceLogKey:record.SourceLogKey||'',
       logRawTerrors:record.LogRawTerrors||'',
       logRoundSeconds:record.LogRoundSeconds??null
     };
   });
   const columns={};
   for(const [key,value]of Object.entries(session.SummaryRoundColumns||{}))
     columns[nativeRoundName(key)]=value;
   return {
     id:String(session.Id||uid()),name:String(session.Name||'周回'),
     createdAt:session.CreatedAt||null,
     records,summaryRoundOrder:(session.SummaryRoundOrder||[]).map(nativeRoundOrderKey),
     summaryRoundColumns:columns
   };
 });
 if(!sessions.length)throw Error('元ツールの周回が見つかりません');
 const active=String(source.CurrentSessionId||sessions[0].id);
 return {sessions,active:sessions.some(x=>x.id===active)?active:sessions[0].id,
   mode:'icon',summaryViewVersion:2};
}
function validateWebImport(data){
 if(!data||!Array.isArray(data.sessions)||!data.sessions.length)throw Error('周回データがありません');
 if(data.sessions.some(s=>typeof s.id!=='string'||typeof s.name!=='string'||!Array.isArray(s.records)||s.records.some(r=>typeof r.id!=='string'||!rounds.includes(r.round)||!Array.isArray(r.terrors))))
   throw Error('記録の形式が異なります');
 return data;
}
function recognizeImportedData(obj){
 if(obj?.app==='ton-round-records-web')return {data:validateWebImport(obj.data),native:false};
 if(Array.isArray(obj?.Sessions)||Array.isArray(obj?.Data?.Sessions))
   return {data:validateWebImport(toWebFromNative(obj)),native:true};
 return {data:validateWebImport(obj),native:false};
}

/* The original WinForms importer reads VRChat logs from disk. A web page may
   only read files explicitly selected by the user, never the AppData folder. */
let vrcLogScan=null;
function vrcLogRecord(round){
 return {
   id:uid(),round:round.round,variant:round.variant||'',
   terrors:[...round.terrors],map:round.map||'',rareChoices:{},
   survived:round.estimatedSurvivors??-1,
   players:round.estimatedPlayers??-1,newPlayers:null,
   sourceLogKey:round.sourceLogKey,logRawTerrors:round.rawKillerIds,
   logRoundSeconds:round.durationSeconds,createdAt:round.start
 };
}
/* Import the checked sidebar rounds into the active session, preserving deduplication. */
function vrcLogImportSelected(sourceKeys){
 if(!vrcLogScan||!sourceKeys||!sourceKeys.size)return 0;
 const existing=new Set(current().records.map(r=>String(r.sourceLogKey||'').toLowerCase()).filter(Boolean));
 let added=0;
 for(const round of vrcLogScan.rounds){
   const key=String(round.sourceLogKey||'');
   if(!key||!sourceKeys.has(key)||!round.round||existing.has(key.toLowerCase()))continue;
   current().records.push(vrcLogRecord(round));
   existing.add(key.toLowerCase());added++;
 }
 if(added){
   persist();renderRecords();
   notify(added+'件のログ成果を追加しました（人数は推定値）');
 }
 window.TON_VRC_PANEL?.renderScan();
 return added;
}
window.TON_VRC_IMPORT={importSelected:vrcLogImportSelected};

};

/* The original 1150px-wide window looked miniature on a full-screen monitor.
   Scale the complete interface continuously while reserving 24px on each side. */
function resizeArchiveInterface(){
  const shell=document.querySelector('.shell');
  const viewport=window.innerWidth;
  const scale=viewport>=1280?Math.min(1.55,Math.max(1,(viewport-48)/1250)):1;
  shell.style.zoom=String(Math.round(scale*1000)/1000);
  if(typeof selector!=='undefined'&&selector==='terror')fitStandaloneTerrorGrid();
}
